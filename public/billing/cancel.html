<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Cancelado — Modelo Fácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 60px 40px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .cancel-icon {
      width: 80px;
      height: 80px;
      background: #f56565;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
    }

    .cancel-icon svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 3;
      fill: none;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      color: #718096;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      text-decoration: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cancel-icon">
      <svg viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>

    <h1>Pagamento Cancelado</h1>
    <p>Você cancelou o processo de pagamento. Não se preocupe, nenhuma cobrança foi realizada.</p>

    <div class="buttons">
      <a href="/planos.html" id="tryAgainBtn" class="btn btn-primary">Tentar Novamente</a>
      <a href="/" class="btn btn-secondary">Voltar ao App</a>
    </div>
  </div>

  <script>
    // Preserva plano se session_id disponível na URL
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');

    if (sessionId) {
      // Tenta recuperar plano do session metadata via API
      (async () => {
        try {
          const res = await fetch(`/api/stripe/session/${sessionId}`, {
            headers: {
              'Authorization': `Bearer ${localStorage.getItem('sb-access-token') || ''}`
            }
          });

          if (res.ok) {
            const data = await res.json();
            // Session tem metadata.plan_id
            // Atualiza link para preservar plano
            const btn = document.getElementById('tryAgainBtn');
            if (data.metadata && data.metadata.plan_id) {
              btn.href = `/planos.html?plan=${data.metadata.plan_id}`;
            }
          }
        } catch (err) {
          console.log('Não foi possível recuperar plano, redirecionando para /planos.html');
        }
      })();
    }
  </script>
</body>
</html>
