<!DOCTYPE html>
<html>
<head>
  <title>Teste Vídeos</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
    .video-container { margin: 20px 0; }
    video { width: 300px; height: 400px; object-fit: cover; border: 2px solid #2db896; }
  </style>
</head>
<body>
  <h1>Teste de Vídeos</h1>
  <div id="videos"></div>

  <script>
    fetch('/api/landing-data')
      .then(r => r.json())
      .then(data => {
        console.log('Data completa:', data);
        const container = document.getElementById('videos');

        if (data.videos && data.videos.length > 0) {
          console.log('Total de vídeos:', data.videos.length);
          data.videos.forEach((video, i) => {
            console.log(`Vídeo ${i}:`, video);
            const div = document.createElement('div');
            div.className = 'video-container';

            const h3 = document.createElement('h3');
            h3.textContent = `${video.generation_type} (${i})`;
            div.appendChild(h3);

            const vid = document.createElement('video');
            vid.src = video.result_url;
            vid.controls = true;
            vid.muted = true;
            vid.loop = true;
            vid.autoplay = true;
            vid.playsInline = true;
            vid.preload = 'auto';
            vid.setAttribute('loading', 'eager');

            vid.addEventListener('loadeddata', () => {
              console.log(`Vídeo ${i} carregado com sucesso!`);
            });

            vid.addEventListener('error', (e) => {
              console.error(`Erro no vídeo ${i}:`, e, vid.error);
            });

            div.appendChild(vid);

            const p = document.createElement('p');
            p.innerHTML = `<small>${video.result_url.substring(0, 100)}...</small>`;
            div.appendChild(p);

            container.appendChild(div);
          });
        } else {
          container.innerHTML = '<p>Nenhum vídeo encontrado</p>';
          console.log('Nenhum vídeo na resposta');
        }
      })
      .catch(err => {
        console.error('Erro ao buscar:', err);
        document.getElementById('videos').innerHTML = '<p>Erro ao carregar: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
