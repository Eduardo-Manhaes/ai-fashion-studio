<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — Modelo Fácil</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300bfa5' stroke-width='2'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>">

  <style>
    /* Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Variáveis */
    :root {
      --verde-primario: #00bfa5;
      --verde-escuro:   #007a6e;
      --verde-claro:    #1de9b6;
      --verde-menta:    #b2dfdb;
      --bg-principal:   #0a1a18;
      --bg-card:        #0f2421;
      --bg-elevado:     #163330;
      --bg-hover:       #1a3d39;
      --texto-principal:  #ffffff;
      --texto-secundario: #a8c5c1;
      --texto-muted:      #5a8a84;
      --acento-coral:   #FF6B6B;
      --borda:       rgba(0, 191, 165, 0.15);
      --borda-hover: rgba(0, 191, 165, 0.45);
      --gradiente-hero: linear-gradient(135deg, #007a6e 0%, #0a1a18 50%, #00bfa5 100%);
      --gradiente-btn:  linear-gradient(135deg, #00bfa5 0%, #007a6e 100%);
      --shadow-verde: 0 4px 24px rgba(0, 191, 165, 0.08);
    }

    body {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      background: var(--bg-principal);
      color: var(--texto-principal);
      min-height: 100vh;
      display: flex;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Background animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(0, 191, 165, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0, 122, 110, 0.12) 0%, transparent 50%),
        var(--bg-principal);
      z-index: -1;
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    /* Container principal */
    .auth-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* === PAINEL ESQUERDO (40%) === */
    .welcome-panel {
      flex: 0 0 40%;
      background: var(--gradiente-hero);
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: slideInLeft 0.6s ease;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .welcome-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(0, 191, 165, 0.15) 0%, transparent 50%);
      animation: panelShimmer 6s ease-in-out infinite;
    }

    @keyframes panelShimmer {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .welcome-content {
      position: relative;
      z-index: 1;
    }

    .logo-large {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #ffffff;
      text-shadow: 0 2px 20px rgba(0, 191, 165, 0.3);
    }

    .tagline {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .benefits-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.85);
      animation: fadeSlideUp 0.6s ease both;
    }

    .benefit-item:nth-of-type(1) { animation-delay: 0.2s; }
    .benefit-item:nth-of-type(2) { animation-delay: 0.3s; }
    .benefit-item:nth-of-type(3) { animation-delay: 0.4s; }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .benefit-icon {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.5rem;
    }

    /* === PAINEL DIREITO (60%) === */
    .form-panel {
      flex: 0 0 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      animation: slideInRight 0.6s ease;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 36, 33, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--borda);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: cardSlideUp 0.8s ease 0.2s both;
    }

    @keyframes cardSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .auth-card h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--verde-claro), var(--verde-primario));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-card .subtitle {
      font-size: 0.95rem;
      color: var(--texto-secundario);
      margin-bottom: 36px;
      line-height: 1.5;
    }

    /* Message box */
    .message-box {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      display: none;
    }

    .message-box.show {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }

    .message-box.success {
      background: rgba(29, 233, 182, 0.15);
      border: 1px solid var(--verde-claro);
      color: var(--verde-claro);
    }

    .message-box.error {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid var(--acento-coral);
      color: var(--acento-coral);
    }

    /* Campos com label flutuante */
    .input-group {
      position: relative;
      margin-bottom: 24px;
      animation: fadeSlideUp 0.6s ease both;
      animation-delay: 0.3s;
    }

    .input-group label {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 0.9rem;
      color: var(--texto-muted);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--borda);
      background: var(--bg-elevado);
      color: var(--texto-principal);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--verde-primario);
      background: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(0, 191, 165, 0.1);
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -10px;
      left: 12px;
      font-size: 0.75rem;
      color: var(--verde-primario);
      background: var(--bg-card);
      padding: 0 8px;
    }

    /* Botão */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--gradiente-btn);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-verde);
      margin-top: 8px;
      animation: fadeSlideUp 0.6s ease both;
      animation-delay: 0.4s;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 191, 165, 0.25);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Link de voltar ao login */
    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--texto-secundario);
      animation: fadeSlideUp 0.6s ease both;
      animation-delay: 0.5s;
    }

    .login-link a {
      color: var(--verde-claro);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .login-link a:hover {
      color: var(--verde-primario);
      text-decoration: underline;
    }

    /* Responsivo */
    @media (max-width: 1024px) {
      .auth-wrapper {
        flex-direction: column;
      }

      .welcome-panel {
        flex: 0 0 auto;
        padding: 40px 28px;
        min-height: 300px;
      }

      .logo-large {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1.1rem;
        margin-bottom: 32px;
      }

      .form-panel {
        flex: 1;
        padding: 32px 20px;
      }

      .auth-card {
        padding: 36px 28px;
      }

      .auth-card h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <!-- Painel de Boas-vindas (Esquerda) -->
    <aside class="welcome-panel">
      <div class="welcome-content">
        <h1 class="logo-large">Modelo Fácil</h1>
        <p class="tagline">Recupere o acesso à sua conta de forma rápida e segura.</p>

        <ul class="benefits-list">
          <li class="benefit-item">
            <div class="benefit-icon">🔒</div>
            <span>Processo rápido e seguro</span>
          </li>
          <li class="benefit-item">
            <div class="benefit-icon">⏱️</div>
            <span>Link válido por 1 hora</span>
          </li>
          <li class="benefit-item">
            <div class="benefit-icon">✉️</div>
            <span>Enviado para seu e-mail</span>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Painel do Formulário (Direita) -->
    <main class="form-panel">
      <div class="auth-card">
        <h1>Recuperar Senha</h1>
        <p class="subtitle">Enviaremos um link de recuperação para seu e-mail cadastrado.</p>

        <div id="messageBox" class="message-box"></div>

        <form id="forgotForm">
          <div class="input-group">
            <input
              type="email"
              id="email"
              required
              autocomplete="email"
              placeholder="seu@email.com"
            >
            <label for="email">E-mail</label>
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">
            Enviar Link de Recuperação
          </button>

          <p class="login-link">
            Lembrou a senha? <a href="/login.html">Entrar</a>
          </p>
        </form>
      </div>
    </main>
  </div>

  <script src="/lib/auth.js"></script>
  <script>
    (async function() {
      const form = document.getElementById('forgotForm');
      const btn = document.getElementById('submitBtn');
      const messageBox = document.getElementById('messageBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        messageBox.classList.remove('show', 'success', 'error');
        btn.disabled = true;
        btn.textContent = 'Enviando...';

        const email = document.getElementById('email').value;

        try {
          const sb = await window.AuthLib.loadSupabase();

          const { data, error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: `${window.location.origin}/reset-password.html`
          });

          if (error) throw error;

          // Sucesso
          messageBox.textContent = '✓ Link de recuperação enviado! Verifique seu e-mail (inclua spam/lixo eletrônico).';
          messageBox.classList.add('show', 'success');
          form.reset();
          btn.textContent = 'Link Enviado';

          // Opcional: redirecionar para login após 5s
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 5000);

        } catch (err) {
          messageBox.textContent = err.message || 'Erro ao enviar e-mail. Tente novamente.';
          messageBox.classList.add('show', 'error');
          btn.disabled = false;
          btn.textContent = 'Enviar Link de Recuperação';
        }
      });
    })();
  </script>
</body>
</html>
